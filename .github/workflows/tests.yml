name: tests
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx eslint .               # JavaScript : page, modules web, Worker, tests Node
      - run: pipx run ruff check .      # Python (ruff.toml)
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci                    # pyodide (version navigateur, tests/test_web.py)
      - run: pip install -r requirements-dev.txt -c requirements.lock
      # Chromium de Playwright, utilisé par tests/test_browser.py (échec si absent)
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -rs tests
        env:
          TRAFFICKER_REQUIRE_BROWSER: "1"
  worker:
    # Worker de bout en bout (wrangler dev + faux CM360, faux e-mail, faux Claude) :
    # comptes, droits, ad servers, URL, surveillance programmée, assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node tests/worker_cm360.mjs
  deploy:
    # Mise en production seulement si lint, pytest et Worker sont verts. Inactif tant que la variable
    # de dépôt DEPLOY_FROM_CI vaut autre chose que "true" (Settings → Secrets and variables → Actions →
    # Variables) ; secrets requis : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Une fois activé,
    # déconnecter le déploiement automatique de Cloudflare (Workers Builds) pour ne pas publier deux fois.
    needs: [lint, pytest, worker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_FROM_CI == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx wrangler deploy
